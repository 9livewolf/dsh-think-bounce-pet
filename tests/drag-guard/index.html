<!doctype html>
<html data-platform="darwin">
<head>
  <meta charset="utf-8" />
  <title>dsh-think-bounce-pet · macOS drag composition test</title>
  <!-- A replica of the DSH darwin drag contract (ui-web base.css). -->
  <style>
    html, body, #root { height: 100%; margin: 0; }
    html[data-platform=darwin] body { isolation: isolate; }
    html[data-platform=darwin] [data-window-drag] { -webkit-app-region: drag; }
    html[data-platform=darwin] [data-window-drag-recall] { -webkit-app-region: no-drag; }
    html[data-platform=darwin] body > :not(#root) { -webkit-app-region: no-drag; }
    html[data-platform=darwin] :is(button, a, input, select, textarea, summary, [contenteditable=true], [tabindex], [role=dialog], [role=alertdialog], [role=menu], [role=listbox], [role=tooltip], [role=button], [role=link], [role=tab], [role=menuitem], [role=menuitemcheckbox], [role=menuitemradio], [role=option], [role=checkbox], [role=radio], [role=switch], [role=slider], [role=combobox], [role=textbox]) { -webkit-app-region: no-drag; }
    #content { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: #f2f2f2; }
    #chrome { position: absolute; left: 0; right: 0; top: 0; height: 56px; background: #2b2b2b; }
    #band { position: absolute; left: 0; right: 0; top: 260px; height: 160px; background: #2f3a52; }
    #result { position: fixed; left: 8px; bottom: 8px; z-index: 20000; background: #000; color: #0f0; font: 11px/1.4 monospace; max-width: 700px; white-space: pre-wrap; padding: 4px; }
  </style>
</head>
<body>
  <div id="root">
    <div id="content"></div>
    <div id="chrome" data-window-drag><span>chrome row (drag)</span></div>
    <div id="band" data-window-drag><span>probe drag row</span></div>
  </div>
  <div id="result">pending</div>
  <!-- Holds the load event open so headless --dump-dom happens after the run. -->
  <img src="/slow?hold=1" alt="" style="position:fixed;left:-10px;top:-10px;width:1px;height:1px;opacity:0" />

  <script src="harness.js"></script>
  <script>
    window.__ModuleLoader__ = { load: function (definition) { window.__tbpDefinition = definition; } };
  </script>
  <script src="client.js"></script>
  <script>
    (function () {
      var ReactStub = {
        useEffect: function () {},
        useSyncExternalStore: function () {},
        createElement: function () { return {}; }
      };
      function requireStub(id) {
        if (id === "react") return ReactStub;
        throw new Error("unexpected require: " + id);
      }
      window.__tbpModule = window.__tbpDefinition.factory(requireStub);
      window.__tbpModule.apply({
        sessions: {
          list: {
            subscribe: function () { return function () {}; },
            getSnapshot: function () { return { current: undefined }; }
          }
        },
        effect: function (fn) {
          var result = fn();
          return function () { if (typeof result === "function") result(); };
        },
        slots: { inject: function () {}, register: function () {} }
      });
      window.__runDragTest();
    })();
  </script>
</body>
</html>
